[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-jarvis"
dynamic = ["version"]
description = "An offline-first foundation for a modular personal assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jarvis.__version__"}
